
name: OpenStory client only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    name: Build Windows x64 client
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure x64 Release build
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build OpenStory only
        shell: pwsh
        run: cmake --build build --config Release --target OpenStory --parallel

      - name: Package client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE

          $clientExe = Join-Path $repoRoot 'wz\OpenStory.exe'
          if (-not (Test-Path -LiteralPath $clientExe -PathType Leaf)) {
            throw "Expected client executable was not produced: $clientExe"
          }

          $vendorDir = Join-Path $repoRoot 'vendor'
          $bassDll = Get-ChildItem -Path $vendorDir -Filter 'bass.dll' -File -Recurse |
            Where-Object { $_.FullName -match '(?i)[\\/](x64|win64)[\\/]' } |
            Select-Object -First 1

          if ($null -eq $bassDll) {
            throw 'The repository does not contain an x64 BASS runtime DLL. No incomplete client package was created.'
          }

          $freetypeDll = Join-Path $vendorDir 'freetype\win64\freetype.dll'
          if (-not (Test-Path -LiteralPath $freetypeDll -PathType Leaf)) {
            throw "Required x64 FreeType runtime DLL not found: $freetypeDll"
          }

          $expectedFreetypeHash = '8B0F1E91E80D441869169A3E9D924BAAFB2203A04CB90D1A11AC7ED22C81A24E'
          $actualFreetypeHash = (Get-FileHash -LiteralPath $freetypeDll -Algorithm SHA256).Hash
          if ($actualFreetypeHash -ne $expectedFreetypeHash) {
            throw "The vendored FreeType DLL hash did not match the repository's documented hash. Expected: $expectedFreetypeHash Actual: $actualFreetypeHash"
          }

          $packageRoot = Join-Path $repoRoot 'dist\OpenStory-client'
          $clientDir = Join-Path $packageRoot 'wz'
          New-Item -ItemType Directory -Force -Path $clientDir | Out-Null

          Copy-Item -LiteralPath $clientExe -Destination (Join-Path $clientDir 'OpenStory.exe')
          Copy-Item -LiteralPath $bassDll.FullName -Destination (Join-Path $clientDir 'bass.dll')
          Copy-Item -LiteralPath $freetypeDll -Destination (Join-Path $clientDir 'freetype.dll')

          @(
            'ServerIP = 2.56.246.136'
            'ServerPort = 8484'
            'SaveLogin = false'
          ) | Set-Content -LiteralPath (Join-Path $clientDir 'Settings') -Encoding ascii

          @(
            'OpenStory client-only build'
            ''
            'This package contains the Windows x64 client and its BASS and FreeType runtime DLLs.'
            'It does not include the GenMs launcher, an updater, or MapleStory game data.'
            ''
            'SETUP'
            '1. Place your compatible v83 NX game-data files in this wz folder, beside OpenStory.exe.'
            '   The project expects NX files, including a compatible UI.nx. Game data is not included.'
            '2. Settings is configured for server 2.56.246.136 on login port 8484.'
            '3. Keep SaveLogin=false unless you deliberately want the client to remember login details.'
            '4. Start wz\OpenStory.exe.'
            ''
            'The vendored FreeType 2.9.1 DLL requires the Microsoft Visual C++ 2015-2022 Redistributable (x64).'
            'If Windows reports a missing VCRUNTIME140 or MSVCP140 runtime DLL, install the current x64 redistributable from Microsoft:'
            'https://aka.ms/vc14/vc_redist.x64.exe'
            ''
            'If login works but channel entry fails, check that the channel ports configured in Cosmic are reachable from your PC.'
            'The build is not a malware certification. Scan the downloaded files with your security software before running them.'
          ) | Set-Content -LiteralPath (Join-Path $packageRoot 'README.txt') -Encoding utf8

          @(
            "Source: https://github.com/rdiol12/OpenStory"
            "Commit: $env:GITHUB_SHA"
            'Target: Windows x64 Release'
            'Launcher and updater: excluded'
            "FreeType DLL SHA256: $actualFreetypeHash"
          ) | Set-Content -LiteralPath (Join-Path $packageRoot 'BUILD-INFO.txt') -Encoding utf8

          $checksumLines = Get-ChildItem -LiteralPath $clientDir -File |
            Sort-Object Name |
            ForEach-Object {
              $fileHash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "$($fileHash.Hash)  wz/$($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path $packageRoot 'SHA256SUMS.txt'),
            [string[]]$checksumLines,
            [System.Text.Encoding]::ASCII
          )

      - name: Upload client ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: OpenStory-client-windows-x64
          path: dist/OpenStory-client
          if-no-files-found: error
          retention-days: 7
